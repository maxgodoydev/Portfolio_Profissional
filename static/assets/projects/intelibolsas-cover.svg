<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
  <title id="t">InteliBolsas</title>
  <desc id="d">Composição abstrata representando um diagrama de entidades relacionais e um painel de gestão com múltiplos perfis</desc>
  <defs>
    <linearGradient id="ibBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111512"/>
      <stop offset="1" stop-color="#1a1c22"/>
    </linearGradient>
    <linearGradient id="ibGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7a24a"/>
      <stop offset="1" stop-color="#7c4653"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" rx="48" fill="url(#ibBg)"/>
  <g opacity=".18" stroke="#6f7b83" stroke-width="2">
    <path d="M0 170H1400M0 340H1400M0 510H1400M0 680H1400"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900"/>
  </g>

  <rect x="95" y="90" width="1210" height="720" rx="38" fill="#171b18" stroke="#343a35" stroke-width="3"/>
  <circle cx="145" cy="137" r="9" fill="#b35c3d"/><circle cx="175" cy="137" r="9" fill="#c7a24a"/><circle cx="205" cy="137" r="9" fill="#7d8b72"/>
  <text x="1155" y="145" fill="#aaa59a" font-family="Arial" font-size="20" text-anchor="end">gestão de bolsas de estudo</text>

  <!-- Left: relational entity diagram -->
  <text x="140" y="200" fill="#f1ece2" font-family="Arial" font-size="24" font-weight="700">Modelagem relacional</text>

  <g font-family="Arial">
    <!-- Alunos -->
    <rect x="140" y="235" width="220" height="150" rx="14" fill="#0e1110" stroke="#6f7b83" stroke-width="2"/>
    <rect x="140" y="235" width="220" height="36" rx="14" fill="#202420"/>
    <text x="250" y="259" fill="#f1ece2" font-size="18" font-weight="700" text-anchor="middle">alunos</text>
    <text x="160" y="296" fill="#aaa59a" font-size="14">id_aluno (PK)</text>
    <text x="160" y="320" fill="#aaa59a" font-size="14">nome, email</text>
    <text x="160" y="344" fill="#aaa59a" font-size="14">id_curso (FK)</text>
    <text x="160" y="368" fill="#aaa59a" font-size="14">status</text>

    <!-- Instituições -->
    <rect x="140" y="440" width="220" height="150" rx="14" fill="#0e1110" stroke="#7c4653" stroke-width="2"/>
    <rect x="140" y="440" width="220" height="36" rx="14" fill="#202420"/>
    <text x="250" y="464" fill="#f1ece2" font-size="18" font-weight="700" text-anchor="middle">instituições</text>
    <text x="160" y="501" fill="#aaa59a" font-size="14">id_instituicao (PK)</text>
    <text x="160" y="525" fill="#aaa59a" font-size="14">nome, cnpj</text>
    <text x="160" y="549" fill="#aaa59a" font-size="14">cidade, uf</text>
    <text x="160" y="573" fill="#aaa59a" font-size="14">tipo</text>

    <!-- Bolsas -->
    <rect x="410" y="335" width="220" height="180" rx="14" fill="#0e1110" stroke="#c7a24a" stroke-width="2"/>
    <rect x="410" y="335" width="220" height="36" rx="14" fill="#202420"/>
    <text x="520" y="359" fill="#f1ece2" font-size="18" font-weight="700" text-anchor="middle">bolsas</text>
    <text x="430" y="396" fill="#aaa59a" font-size="14">id_bolsa (PK)</text>
    <text x="430" y="420" fill="#aaa59a" font-size="14">id_instituicao (FK)</text>
    <text x="430" y="444" fill="#aaa59a" font-size="14">id_curso (FK)</text>
    <text x="430" y="468" fill="#aaa59a" font-size="14">percentual</text>
    <text x="430" y="492" fill="#aaa59a" font-size="14">vagas, prazo</text>

    <path d="M360 310C385 340 385 340 410 400" fill="none" stroke="#c7a24a" stroke-width="2.5"/>
    <path d="M360 495C385 470 385 470 410 445" fill="none" stroke="#c7a24a" stroke-width="2.5"/>
    <circle cx="360" cy="310" r="5" fill="#6f7b83"/><circle cx="410" cy="400" r="5" fill="#c7a24a"/>
    <circle cx="360" cy="495" r="5" fill="#7c4653"/><circle cx="410" cy="445" r="5" fill="#c7a24a"/>
  </g>

  <!-- Right: multi-profile dashboard -->
  <text x="700" y="200" fill="#f1ece2" font-family="Arial" font-size="24" font-weight="700">Painéis por perfil</text>

  <g font-family="Arial">
    <rect x="700" y="225" width="164" height="42" rx="21" fill="#0e1110" stroke="#7c4653" stroke-width="2"/>
    <text x="782" y="252" fill="#f1ece2" font-size="16" font-weight="700" text-anchor="middle">Administração</text>
    <rect x="880" y="225" width="150" height="42" rx="21" fill="#0e1110" stroke="#c7a24a" stroke-width="2"/>
    <text x="955" y="252" fill="#f1ece2" font-size="16" font-weight="700" text-anchor="middle">Instituição</text>
    <rect x="1046" y="225" width="120" height="42" rx="21" fill="#0e1110" stroke="#6f7b83" stroke-width="2"/>
    <text x="1106" y="252" fill="#f1ece2" font-size="16" font-weight="700" text-anchor="middle">Aluno</text>

    <rect x="700" y="290" width="466" height="46" rx="10" fill="#0e1110" stroke="#343a35" stroke-width="2"/>
    <circle cx="722" cy="313" r="8" fill="none" stroke="#aaa59a" stroke-width="2.5"/>
    <path d="M728 319l8 8" stroke="#aaa59a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="742" y="318" fill="#aaa59a" font-size="15">Buscar bolsa, curso ou instituição…</text>

    <rect x="700" y="352" width="466" height="86" rx="12" fill="#202420" stroke="#343a35" stroke-width="2"/>
    <rect x="700" y="352" width="6" height="86" fill="#c7a24a"/>
    <text x="724" y="382" fill="#f1ece2" font-size="17" font-weight="700">Bolsa Integral — Engenharia</text>
    <text x="724" y="406" fill="#aaa59a" font-size="14">Instituição Parceira A · 12 vagas</text>
    <rect x="1090" y="364" width="60" height="26" rx="13" fill="#0e1110" stroke="#7d8b72"/>
    <text x="1120" y="382" fill="#7d8b72" font-size="12" text-anchor="middle">ABERTA</text>

    <rect x="700" y="448" width="466" height="86" rx="12" fill="#202420" stroke="#343a35" stroke-width="2"/>
    <rect x="700" y="448" width="6" height="86" fill="#7c4653"/>
    <text x="724" y="478" fill="#f1ece2" font-size="17" font-weight="700">Bolsa Parcial — Design</text>
    <text x="724" y="502" fill="#aaa59a" font-size="14">Instituição Parceira B · 5 vagas</text>
    <rect x="1090" y="460" width="60" height="26" rx="13" fill="#0e1110" stroke="#c7a24a"/>
    <text x="1120" y="478" fill="#c7a24a" font-size="12" text-anchor="middle">EM BREVE</text>

    <rect x="700" y="544" width="466" height="86" rx="12" fill="#202420" stroke="#343a35" stroke-width="2"/>
    <rect x="700" y="544" width="6" height="86" fill="#6f7b83"/>
    <text x="724" y="574" fill="#f1ece2" font-size="17" font-weight="700">Bolsa Integral — ADS</text>
    <text x="724" y="598" fill="#aaa59a" font-size="14">Instituição Parceira C · 8 vagas</text>
    <rect x="1090" y="556" width="60" height="26" rx="13" fill="#0e1110" stroke="#7d8b72"/>
    <text x="1120" y="574" fill="#7d8b72" font-size="12" text-anchor="middle">ABERTA</text>
  </g>

  <!-- Bottom chips -->
  <g font-family="Arial" font-size="18" font-weight="700">
    <rect x="140" y="738" width="150" height="46" rx="23" fill="#0e1110" stroke="#343a35"/>
    <text x="215" y="767" fill="#f1ece2" text-anchor="middle">CRUD</text>
    <rect x="306" y="738" width="150" height="46" rx="23" fill="#0e1110" stroke="#343a35"/>
    <text x="381" y="767" fill="#f1ece2" text-anchor="middle">MySQL</text>
    <rect x="472" y="738" width="290" height="46" rx="23" fill="#0e1110" stroke="#343a35"/>
    <text x="617" y="767" fill="#f1ece2" text-anchor="middle">Múltiplos perfis</text>
  </g>
</svg>
